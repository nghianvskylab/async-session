[tool.poetry]
name = "test-performance"
version = "0.1.0"
description = "FastAPI performance testing with PostgreSQL"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "api"}]
scripts = {run = "uvicorn api.main:app --reload"}

[tool.poetry.dependencies]
python = "^3.12"
sqlmodel = "^0.0.14"
asyncpg = "^0.29.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
alembic = "^1.17.2"
fastapi = "^0.121.3"
psycopg2-binary = "^2.9.11"
greenlet = "^3.2.4"
sqlalchemy = "^2.0.44"
pytz = "^2025.2"
asgi-correlation-id = "^4.3.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pysen]
version = "0.11.4"
builder = ".lint.py"

[tool.pysen.lint]
enable_black = true
enable_flake8 = true
enable_isort = true
enable_mypy = true
mypy_preset = "strict"
line_length = 88
py_version = "py310"

[[tool.pysen.lint.mypy_targets]]
  paths = ["api"]

[tool.pysen.lint.source]
# includes = ["."]
excludes = [
  ".venv",
  "venv",
  "./api/models/schema/misc/pydantic_field.py",  # Imported from online
]

[tool.black] # automatically generated by pysen
# pysen ignores and overwrites any modifications
line-length = 88
target-version = ["py310"]

[tool.isort] # automatically generated by pysen
# pysen ignores and overwrites any modifications
default_section = "THIRDPARTY"
ensure_newline_before_comments = true
force_grid_wrap = 0
force_single_line = false
include_trailing_comma = true
line_length = 88
multi_line_output = 3
use_parentheses = true

[tool.poetry.group.lint.dependencies]
pysen = "^0.11"
mypy = "^1.18.2"
black = "^23.0"
isort = "^5.0"
flake8 = "^6.0"
types-pytz = "^2024.1.0.20240417"
