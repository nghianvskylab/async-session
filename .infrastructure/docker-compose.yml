services:
  postgres:
    image: postgres:15.15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: fastapi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastapi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: ..
      dockerfile: .infrastructure/Dockerfile
    container_name: api
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: fastapi_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fastapi_db
      DEBUG: "true"
      LOG_LEVEL: INFO
    ports:
      - "7999:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fastapi_network
    volumes:
      - ..:/app
    command: >
      sh -c "uvicorn api.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:

networks:
  fastapi_network:
    driver: bridge
